{{- if and .Values.web.altcha.enabled (not .Values.web.altcha.existingSecretName) }}
{{- $secretName := "devguard-web-altcha" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "devguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $existing }}
  hmacSecret: {{ index $existing.data "hmacSecret" | b64dec }}
  {{- else }}
  hmacSecret: {{ randAlphaNum 64 }}
  {{- end }}
{{- end }}
