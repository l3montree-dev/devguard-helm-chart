{{- $postgresqlImage := include "devguard.image" (dict "image" .Values.postgresql.image "defaultTag" .Chart.AppVersion) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-river-user
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: create-river-user
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: create-river-user
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: create-river-user
        image: {{ $postgresqlImage | quote }}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          until pg_isready -q; do
            echo "waiting for postgres at ${PGHOST}:${PGPORT}"
            sleep 2
          done

          psql -v ON_ERROR_STOP=1 \
            -v river_user="${RIVER_POSTGRES_USER}" \
            -v river_db="${RIVER_POSTGRES_DB}" \
            -v river_password="${RIVER_POSTGRES_PASSWORD}" <<'SQL'
          SELECT format('CREATE USER %I PASSWORD %L', :'river_user', :'river_password')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'river_user')
          \gexec

          SELECT format('CREATE DATABASE %I OWNER %I', :'river_db', :'river_user')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'river_db')
          \gexec

          \c :"river_db"
          GRANT USAGE, CREATE ON SCHEMA public TO :"river_user";
          SQL
        env:
        - name: PGHOST
          value: {{ include "devguard.postgresHost" . | quote }}
        - name: PGPORT
          value: {{ include "devguard.postgresPort" . | quote }}
        - name: PGSSLMODE
          value: {{ include "devguard.postgresSslMode" . | quote }}
        - name: PGUSER
          value: devguard
        - name: PGDATABASE
          value: devguard
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: postgres-password
        - name: RIVER_POSTGRES_USER
          value: river
        - name: RIVER_POSTGRES_DB
          value: river
        - name: RIVER_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: river-db-secret
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
