name: Publish Helm Repository

# Publishes a classic (HTTP) Helm repository to GitHub Pages.
#
# The site is rebuilt from scratch on every run: all `*.tgz` chart packages
# attached to the GitHub releases are downloaded together with their `*.prov`
# provenance files, `helm repo index` generates the `index.yaml`, and
# `artifacthub-repo.yml` is copied next to it so artifacthub.io can pick up the
# repository metadata (ownership claim / verified publisher).
#
# The provenance files must be served as `<chart-url>.prov` — that is exactly
# where `helm verify` and Artifact Hub's "signed" badge look for them.
#
# Requires Pages to be enabled with "GitHub Actions" as the build source
# (Settings → Pages → Build and deployment → Source: GitHub Actions).

on:
  # Called by helm-release.yml once the release and its chart package exist,
  # so the fresh version is part of the index.
  workflow_call:
  # Manual re-index (e.g. after editing artifacthub-repo.yml).
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'artifacthub-repo.yml'
      - '.github/pages/**'
      - '.github/workflows/helm-pages.yml'

permissions: {}

env:
  # Lowest chart version to publish in the index. Older releases stay available
  # on their GitHub release page and in the OCI registry, they are just not part
  # of the HTTP Helm repository.
  MIN_VERSION: '1.2.0'
  # Whether to publish pre-release versions (`-rc.1`, `-test.2`, …). Helm hides
  # them from `helm install`/`helm search` unless `--devel` is passed, but they
  # do show up on Artifact Hub.
  INCLUDE_PRERELEASES: 'false'
  # Public half of the chart signing key. Kept in sync with helm-release.yml,
  # which signs the packages with the private half.
  PUBLIC_KEY: .github/pages/signing-key.asc

# Never let two deployments race for the single Pages environment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to list and download release assets

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5 - https://github.com/actions/checkout/releases/tag/v5.0.0
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1 - https://github.com/Azure/setup-helm/releases/tag/v5.0.1
        with:
          version: '3.19.0'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 - https://github.com/actions/configure-pages/releases/tag/v6.0.0

      - name: Download chart packages from all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site

          TAGS=$(gh release list --limit 500 --exclude-drafts --json tagName --jq '.[].tagName')
          if [ -z "$TAGS" ]; then
            echo "::error::No releases found — nothing to index."
            exit 1
          fi

          SKIPPED=0
          while IFS= read -r TAG; do
            VERSION=${TAG#v}

            # Ignore tags that are not a semantic version (docs tags, branches, …).
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "Skipping $TAG — not a semantic version"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Version without the pre-release suffix, so `1.0.0-rc.1` is compared
            # as `1.0.0` — sort -V only orders plain dotted numbers reliably.
            BASE=${VERSION%%-*}

            if [ "$BASE" != "$VERSION" ] && [ "$INCLUDE_PRERELEASES" != 'true' ]; then
              echo "Skipping $TAG — pre-release"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            LOWEST=$(printf '%s\n%s\n' "$BASE" "$MIN_VERSION" | sort -V | head -n1)
            if [ "$BASE" != "$MIN_VERSION" ] && [ "$LOWEST" = "$BASE" ]; then
              echo "Skipping $TAG — older than $MIN_VERSION"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Releases made before chart signing was introduced have no *.prov
            # asset; gh only fails when neither pattern matches anything.
            if gh release download "$TAG" --pattern '*.tgz' --pattern '*.tgz.prov' --dir site --skip-existing; then
              echo "Downloaded chart package(s) for $TAG"
            else
              echo "::notice::Release $TAG has no chart package attached — skipping"
              SKIPPED=$((SKIPPED + 1))
            fi
          done <<< "$TAGS"

          echo "Skipped $SKIPPED release(s)"

          COUNT=$(find site -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')
          echo "Collected $COUNT chart package(s)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No chart packages found in any release — refusing to publish an empty repository."
            exit 1
          fi

      # Guards against publishing a provenance file that nobody can verify —
      # e.g. after the signing key was rotated but the committed public half
      # was not.
      - name: Verify chart signatures
        run: |
          set -euo pipefail
          if [ ! -f "$PUBLIC_KEY" ]; then
            echo "::warning::$PUBLIC_KEY is missing — skipping signature verification."
            exit 0
          fi
          gpg --dearmor < "$PUBLIC_KEY" > "$RUNNER_TEMP/pubring.gpg"

          SIGNED=0
          UNSIGNED=0
          for CHART in site/*.tgz; do
            if [ -f "$CHART.prov" ]; then
              helm verify "$CHART" --keyring "$RUNNER_TEMP/pubring.gpg"
              SIGNED=$((SIGNED + 1))
            else
              echo "::notice::$(basename "$CHART") has no provenance file — released before chart signing was introduced."
              UNSIGNED=$((UNSIGNED + 1))
            fi
          done
          echo "$SIGNED signed, $UNSIGNED unsigned chart package(s)"

      # Served at <pages-url>/signing-key.asc, which is the URL advertised in the
      # chart's `artifacthub.io/signKey` annotation.
      - name: Publish the signing public key
        run: |
          set -euo pipefail
          if [ -f "$PUBLIC_KEY" ]; then
            cp "$PUBLIC_KEY" site/signing-key.asc
          else
            echo "::warning::$PUBLIC_KEY is missing — users have no key to verify chart signatures against."
          fi

      - name: Generate Helm repository index
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          helm repo index site --url "$BASE_URL"
          echo "--- index.yaml ---"
          cat site/index.yaml

      - name: Add Artifact Hub repository metadata
        run: |
          set -euo pipefail
          # Must live next to index.yaml — Artifact Hub fetches it from the
          # repository URL root.
          test -f artifacthub-repo.yml
          cp artifacthub-repo.yml site/artifacthub-repo.yml

      - name: Add landing page
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          sed "s|__BASE_URL__|$BASE_URL|g" .github/pages/index.html > site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 - https://github.com/actions/upload-pages-artifact/releases/tag/v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # required to deploy to Pages
      id-token: write # required for the Pages deployment OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0 - https://github.com/actions/deploy-pages/releases/tag/v5.0.0
