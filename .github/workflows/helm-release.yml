name: Release Helm Chart

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version to release'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      packages: write  # Required for pushing to GHCR
      id-token: write  # Required for enhanced security
      
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5 - https://github.com/actions/checkout/releases/tag/v5.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Install Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 #v4.3.1
      with:
        version: '3.19.0'

    - name: Log in to GitHub Container Registry
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

    - name: Extract version from tag or input
      id: version
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          VERSION="$INPUT_VERSION"
        elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
          VERSION="0.0.0-main"
        else
          VERSION=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Releasing version: $VERSION"

    - name: Package Helm Chart
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        helm dependency update
        helm package . --version "$VERSION" --destination ./charts/

    - name: Push Helm Chart to GitHub Container Registry
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        CHART_PACKAGE="devguard-$VERSION.tgz"
        echo "Pushing chart: $CHART_PACKAGE to oci://$REGISTRY/$GITHUB_REPOSITORY"
        helm push "./charts/$CHART_PACKAGE" "oci://$REGISTRY/$GITHUB_REPOSITORY"

    - name: Get minor version
      id: minor
      if: startsWith(github.ref, 'refs/tags/')
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        MINOR=$(echo "$VERSION" | cut -d. -f1-2)
        echo "minor=${MINOR}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        RELEASE_BODY: |
          # DevGuard Helm Chart ${{ steps.version.outputs.version }}

          Official Helm chart for deploying the DevGuard platform on Kubernetes.

          ## Installation

          ```bash
          helm install my-devguard oci://ghcr.io/${{ github.repository }}/devguard --version ${{ steps.version.outputs.version }}
          ```

          ## Pull Chart

          ```bash
          helm pull oci://ghcr.io/${{ github.repository }}/devguard --version ${{ steps.version.outputs.version }}
          ```

          ---

          ## Versioning

          All DevGuard components (`devguard`, `devguard-web`, Helm chart) share the same **minor version**. Any `v${{ steps.minor.outputs.minor }}.*` release of one component is compatible with any `v${{ steps.minor.outputs.minor }}.*` release of another. Patch versions are released independently per component — you do not need to upgrade all components simultaneously as long as the minor version matches.

          📖 See [VERSIONING.md](https://github.com/l3montree-dev/devguard/blob/main/VERSIONING.md) for the full policy.
          📋 See [Helm Chart CHANGELOG](https://github.com/l3montree-dev/devguard-helm-chart/blob/main/CHANGELOG.md) for chart-level changes.
          📋 See [DevGuard CHANGELOG](https://github.com/l3montree-dev/devguard/blob/main/CHANGELOG.md) for API and web frontend changes.

          ---

          🐛 Report Issues: https://github.com/l3montree-dev/devguard/issues
          💬 Community: https://github.com/l3montree-dev/devguard/discussions
      run: |
        printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"

        PRERELEASE=""
        case "$TAG" in
          *-rc*|*-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
        esac

        gh release create "$TAG" charts/*.tgz \
          --title "$TAG" \
          --notes-file "$RUNNER_TEMP/release-notes.md" \
          --generate-notes \
          $PRERELEASE

  # Rebuild the HTTP Helm repository on GitHub Pages so `helm repo add` users
  # and Artifact Hub see the new version.
  pages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read # list and download release assets
      pages: write # deploy to GitHub Pages
      id-token: write # Pages deployment OIDC token
    uses: ./.github/workflows/helm-pages.yml
